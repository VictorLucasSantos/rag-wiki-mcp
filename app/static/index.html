<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Local</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dd;
    --accent: #2f6f5e; --accent-soft: #e4efeb; --danger: #b3412f; --user: #2f6f5e; --user-text: #fff;
    --code: #f0efea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161716; --panel: #1f201f; --text: #e9e8e3; --muted: #9a9993; --border: #333431;
      --accent: #6fb9a3; --accent-soft: #233630; --danger: #e07a68; --user: #2e5a4e; --user-text: #eef;
      --code: #2a2b29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; }
  button { font: inherit; cursor: pointer; }
  aside { width: 340px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  aside header { padding: 18px 18px 10px; }
  h1 { font-size: 17px; margin: 0; }
  .status { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .nav { display: flex; gap: 4px; margin: 12px 18px 0; padding: 3px; background: var(--bg); border-radius: 9px; }
  .nav button { flex: 1; background: none; border: none; border-radius: 7px; padding: 6px; color: var(--muted); font-size: 13.5px; }
  .nav button.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }
  .index-picks { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; padding: 14px 18px 4px; font-size: 12.5px; color: var(--muted); }
  .index-picks select { min-width: 0; width: 100%; font: inherit; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; }
  .index-picks select:disabled { opacity: .6; }
  .index-picks .desc { grid-column: 2; font-size: 11.5px; margin-top: -2px; }
  #new-conv { margin: 14px 18px 8px; }
  #convs { list-style: none; margin: 0; padding: 0 10px 14px; overflow-y: auto; flex: 1; }
  #convs li { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  #convs li:hover { background: var(--bg); }
  #convs li.active { background: var(--accent-soft); }
  #convs .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  #convs .meta { font-size: 11px; color: var(--muted); }
  #convs button { background: none; border: none; color: var(--muted); opacity: 0; padding: 2px 6px; border-radius: 6px; }
  #convs li:hover button { opacity: 1; }
  #convs button:hover { color: var(--text); background: var(--panel); }
  #convs button.del-conv:hover { color: var(--danger); }
  .tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: none; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .pane { padding: 14px 18px; display: none; flex-direction: column; gap: 10px; }
  .pane.active { display: flex; }
  #drop { border: 1.5px dashed var(--border); border-radius: 10px; padding: 22px 12px; text-align: center; color: var(--muted); font-size: 13px; transition: .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  #drop b { color: var(--accent); cursor: pointer; }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  textarea { resize: vertical; min-height: 140px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: none; color: var(--accent); border: 1px solid var(--border); }
  .doclist-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .doclist-head button { background: none; border: none; color: var(--accent); font-size: 12px; text-transform: none; letter-spacing: 0; }
  #docs { list-style: none; margin: 0; padding: 0 10px 14px; overflow-y: auto; flex: 1; }
  #docs li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; }
  #docs li:hover { background: var(--bg); }
  #docs .ext { font-size: 10px; font-weight: 600; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 2px 5px; min-width: 36px; text-align: center; }
  #docs .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  #docs .meta { font-size: 11px; color: var(--muted); }
  #docs .del { background: none; border: none; color: var(--muted); opacity: 0; padding: 2px 6px; border-radius: 6px; }
  #docs li:hover .del { opacity: 1; }
  #docs .del:hover { color: var(--danger); background: var(--panel); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px; }
  #toast:empty { display: none; }
  #toast { font-size: 13px; padding: 10px 18px; border-top: 1px solid var(--border); color: var(--muted); min-height: 1.5em; }
  #toast.err { color: var(--danger); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 28px 0; }
  .msg { max-width: 780px; margin: 0 auto 22px; padding: 0 24px; }
  .msg.user .bubble { background: var(--user); color: var(--user-text); margin-left: auto; width: fit-content; max-width: 85%; border-radius: 14px 14px 4px 14px; padding: 9px 14px; white-space: pre-wrap; }
  .msg.bot .bubble { line-height: 1.65; }
  .bubble p { margin: 0 0 .7em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .bubble code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .bubble pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }
  .cite { display: inline-block; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 5px; margin: 0 1px; cursor: pointer; vertical-align: 1px; }
  .cursor > p:last-child::after, .cursor > :is(ul,ol):last-child > li:last-child::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { color: var(--muted); font-size: 14px; }
  .sources { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .sources details { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 13px; }
  .sources details.uncited { opacity: .6; }
  .sources summary { padding: 6px 10px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; }
  .sources summary::-webkit-details-marker { display: none; }
  .sources .excerpt { padding: 0 12px 10px; white-space: pre-wrap; color: var(--muted); max-height: 260px; overflow-y: auto; font-size: 12.5px; }
  .sources details.flash { border-color: var(--accent); }
  .welcome { max-width: 520px; margin: 12vh auto 0; text-align: center; color: var(--muted); padding: 0 24px; }
  .welcome h2 { color: var(--text); font-size: 22px; margin-bottom: 6px; }

  form#ask { max-width: 780px; width: 100%; margin: 0 auto; padding: 0 24px 22px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; }
  .composer textarea { border: none; background: none; min-height: 24px; max-height: 200px; padding: 6px 0; resize: none; outline: none; }
  .composer .btn { border-radius: 10px; }
  .options { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--border); position: relative; cursor: pointer; transition: .15s; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: .15s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { left: 15px; }
  .toggle:has(input:checked) { color: var(--text); }
  .toggle small { color: var(--muted); }
  .score { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hyde { border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .hyde summary { padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .hyde div { padding: 0 12px 10px; white-space: pre-wrap; color: var(--muted); font-size: 12.5px; }
  .model-pick { display: inline-flex; align-items: center; gap: 6px; }
  .model-pick select { font: inherit; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 4px; max-width: 220px; }
  .model-pick[hidden] { display: none; }
  .toggle select { font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0 2px; }
  .toggle:not(:has(input:checked)) select { opacity: .45; }
  .hyde ol { margin: 0; padding: 0 12px 10px 32px; color: var(--muted); font-size: 12.5px; }
  .tags { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .hint { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 6px; }

  @media (max-width: 760px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
    #chat { min-height: 50vh; }
    .msg, form#ask { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>📚 RAG Local</h1>
    <div class="status" id="status">conectando…</div>
  </header>
  <div class="nav">
    <button class="active" data-view="convs">💬 Conversas</button>
    <button data-view="base">📁 Base</button>
  </div>

  <div class="view active" id="view-convs">
    <button class="btn ghost" id="new-conv">+ Nova conversa</button>
    <ul id="convs"><li class="empty">carregando…</li></ul>
  </div>

  <div class="view" id="view-base">
    <div class="index-picks">
      <label for="opt-emb" id="emb-label" hidden title="Modelo que transforma textos em vetores para a busca.">Embedding</label>
      <select id="opt-emb" hidden></select>
      <label for="opt-chunk" title="Como os documentos são cortados em trechos antes de indexar.">Chunker</label>
      <select id="opt-chunk"></select>
      <div class="desc" id="chunk-desc"></div>
    </div>
    <div class="tabs">
      <button class="active" data-tab="files">Arquivos</button>
      <button data-tab="text">Colar texto</button>
    </div>
    <div class="pane active" id="pane-files">
      <div id="drop">Arraste arquivos aqui ou <b id="pick">escolha</b><br><small>.pdf .docx .md .txt .html</small></div>
      <input type="file" id="file" multiple hidden accept=".pdf,.docx,.md,.txt,.html,.htm">
    </div>
    <div class="pane" id="pane-text">
      <input type="text" id="title" placeholder="Título (vira o nome do arquivo)">
      <textarea id="content" placeholder="Cole aqui o conteúdo…"></textarea>
      <button class="btn" id="save-text">Adicionar à base</button>
    </div>
    <div class="doclist-head"><span id="doccount">Documentos</span><button id="reindex" title="Reindexa a pasta docs/ (útil se você copiou arquivos direto para lá)">↻ sincronizar docs/</button></div>
    <ul id="docs"><li class="empty">carregando…</li></ul>
  </div>

  <div id="toast"></div>
</aside>

<main>
  <div id="chat">
  </div>
  <form id="ask">
    <div class="options">
      <label class="model-pick" id="model-pick" hidden title="Modelo do Ollama usado na resposta e também no multi-query e no HyDE. Modelos maiores seguem melhor as regras de citação, mas são mais lentos. Para ter mais opções: ollama pull <modelo>">
        Modelo <select id="opt-model"></select></label>
      <label class="toggle" title="Reordena os 30 candidatos com um cross-encoder (bge-reranker-v2-m3). Mais preciso, ~1-3 s a mais por pergunta. Na primeira vez baixa/carrega ~2 GB.">
        <input type="checkbox" id="opt-rerank"> Reranker <small>mais preciso</small></label>
      <label class="toggle" title="O LLM escreve uma resposta hipotética e ela também é usada na busca vetorial. Ajuda perguntas vagas ou com vocabulário diferente dos documentos; custa uma chamada extra ao LLM.">
        <input type="checkbox" id="opt-hyde"> HyDE <small>perguntas vagas</small></label>
      <label class="toggle" title="O LLM reescreve a pergunta de N jeitos diferentes (sinônimos, termos técnicos, partes separadas) e busca com todas. Aumenta o recall em perguntas com várias partes ou vocabulário diferente dos documentos; custa uma chamada extra ao LLM.">
        <input type="checkbox" id="opt-mq"> Multi-query
        <select id="opt-mq-n" title="Número de variações"><option>2</option><option selected>3</option><option>4</option></select>
        <small>variações</small></label>
    </div>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="Faça uma pergunta…" autofocus></textarea>
      <button class="btn" id="send">Enviar</button>
    </div>
    <div class="hint">Enter envia · Shift+Enter quebra linha</div>
  </form>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let busy = false;

function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : "";
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
}

// ── Base de conhecimento ──────────────────────────────────────
async function loadStatus() {
  try {
    const s = await api("/api/status");
    for (const k of ["rerank", "hyde"]) {
      let v = null;
      try { v = localStorage.getItem(`opt-${k}`); } catch {}
      $(`#opt-${k}`).checked = v === null ? !!s.defaults?.[k] : v === "1";
    }
    let mq = null;
    try { mq = localStorage.getItem("opt-mq"); } catch {}
    mq = mq === null ? (s.defaults?.multi_query || 0) : +mq;
    $("#opt-mq").checked = mq > 0;
    if (mq > 0) $("#opt-mq-n").value = String(Math.min(Math.max(mq, 2), 4));
    $("#status").textContent = `${s.llm_backend} · ${s.vector_backend} · ${s.embedding_model.split("/").pop()} + ${s.chunker}`;
  } catch { $("#status").textContent = "servidor offline"; }
}

async function loadDocs() {
  const ul = $("#docs");
  try {
    const docs = await api("/api/documents");
    $("#doccount").textContent = `Documentos (${docs.length})`;
    if (!docs.length) { ul.innerHTML = `<li class="empty">Nenhum documento ainda. Envie arquivos ou cole um texto.</li>`; return; }
    ul.innerHTML = docs.map(d => {
      const ext = (d.file_type || d.file_name.split(".").pop() || "").replace(".", "");
      return `<li title="${esc(d.source)}">
        <span class="ext">${esc(ext)}</span>
        <span class="name">${esc(d.file_name)}<div class="meta">${d.chunks} trechos · ${(d.chars/1000).toFixed(1)}k caracteres</div></span>
        <button class="del" data-source="${esc(d.source)}" title="Remover da base">✕</button>
      </li>`;
    }).join("");
  } catch (e) { ul.innerHTML = `<li class="empty">Erro: ${esc(e.message)}</li>`; }
}

$("#docs").addEventListener("click", async e => {
  const b = e.target.closest(".del"); if (!b) return;
  const source = b.dataset.source;
  if (!confirm(`Remover "${source}" da base?\nO arquivo também será apagado de docs/.`)) return;
  try {
    await api(`/api/documents?source=${encodeURIComponent(source)}`, { method: "DELETE" });
    toast(`Removido: ${source}`); loadDocs();
  } catch (e) { toast(e.message, true); }
});

function describe(stats) {
  const parts = [];
  if (stats.new) parts.push(`${stats.new} novo(s)`);
  if (stats.updated) parts.push(`${stats.updated} atualizado(s)`);
  if (stats.unchanged) parts.push(`${stats.unchanged} sem mudanças`);
  if (stats.removed) parts.push(`${stats.removed} removido(s)`);
  return (parts.join(", ") || "nada a fazer") + (stats.chunks ? ` · ${stats.chunks} trechos` : "");
}

async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  toast(`Indexando ${files.length} arquivo(s)… (a primeira vez carrega o modelo de embedding e demora)`);
  try {
    const r = await api("/api/documents", { method: "POST", body: fd });
    toast(`✓ ${describe(r.stats)}`); loadDocs();
  } catch (e) { toast(e.message, true); }
}

const drop = $("#drop");
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => upload([...e.dataTransfer.files]));

$("#save-text").onclick = async () => {
  const title = $("#title").value.trim() || "nota", content = $("#content").value;
  const btn = $("#save-text"); btn.disabled = true; toast("Indexando texto…");
  try {
    const r = await api("/api/documents/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title, content }) });
    toast(`✓ ${r.saved[0]}: ${describe(r.stats)}`); $("#title").value = ""; $("#content").value = ""; loadDocs();
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
};

$("#reindex").onclick = async () => {
  toast("Sincronizando a pasta docs/…");
  try { const r = await api("/api/reindex", { method: "POST" }); toast(`✓ ${describe(r.stats)}`); loadDocs(); }
  catch (e) { toast(e.message, true); }
};

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button, .pane").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); $(`#pane-${b.dataset.tab}`).classList.add("active");
});

for (const k of ["rerank", "hyde"]) {
  $(`#opt-${k}`).addEventListener("change", e => { try { localStorage.setItem(`opt-${k}`, e.target.checked ? "1" : "0"); } catch {} });
}

const mqValue = () => $("#opt-mq").checked ? +$("#opt-mq-n").value : 0;
const saveMq = () => { try { localStorage.setItem("opt-mq", String(mqValue())); } catch {} };
$("#opt-mq").addEventListener("change", saveMq);
// Escolher um número liga o multi-query
$("#opt-mq-n").addEventListener("change", () => { $("#opt-mq").checked = true; saveMq(); });

async function loadModels() {
  try {
    const r = await api("/api/models");
    if (!r.models.length) return;
    let saved = null;
    try { saved = localStorage.getItem("opt-model"); } catch {}
    const names = r.models.map(m => m.name);
    const current = names.includes(saved) ? saved : names.includes(r.default) ? r.default : names[0];
    $("#opt-model").innerHTML = r.models.map(m =>
      `<option value="${esc(m.name)}" ${m.name === current ? "selected" : ""}>${esc(m.name)}${m.params ? ` · ${esc(m.params)}` : ""}${m.name === r.default ? " (padrão)" : ""}</option>`).join("");
    $("#model-pick").hidden = false;
  } catch (e) { toast(e.message, true); }
}
$("#opt-model").addEventListener("change", e => { try { localStorage.setItem("opt-model", e.target.value); } catch {} });

// ── Índice: embedding + chunker ───────────────────────────────
let indexState = null;
const indexLabel = (o, current) => o.name === current ? "em uso" : o.indexed ? "índice pronto" : "sem índice";

async function loadIndex() {
  try {
    const r = indexState = await api("/api/index");
    const emb = r.embedding, ch = r.chunker;
    if (emb.models.length) {
      $("#opt-emb").innerHTML = emb.models.map(m => {
        const state = m.name === emb.current || m.indexed ? indexLabel(m, emb.current) : m.downloaded ? "baixado, sem índice" : "não baixado";
        return `<option value="${esc(m.name)}" ${m.name === emb.current ? "selected" : ""} title="${esc(m.description)}">${esc(m.name.split("/").pop())} · ${state}</option>`;
      }).join("");
      $("#opt-emb").hidden = $("#emb-label").hidden = false;
    }
    $("#opt-chunk").innerHTML = ch.options.map(o =>
      `<option value="${esc(o.name)}" ${o.name === ch.current ? "selected" : ""}>${esc(o.name)} · ${indexLabel(o, ch.current)}</option>`).join("");
    showChunkDesc();
  } catch (e) { toast(e.message, true); }
}

function showChunkDesc() {
  const o = indexState?.chunker.options.find(o => o.name === $("#opt-chunk").value);
  $("#chunk-desc").textContent = o?.description || "";
}

async function readSSE(response, handlers) {
  const reader = response.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const event = raw.match(/^event: (.*)$/m)?.[1], data = JSON.parse(raw.match(/^data: (.*)$/m)?.[1] ?? "null");
      handlers[event]?.(data);
    }
  }
}

async function switchIndex(change, sel) {
  const opt = sel.selectedOptions[0], value = sel.value;
  const what = change.chunker ? `o chunker para ${value}` : `o modelo de embedding para ${value}`;
  const warn = /índice pronto/.test(opt.textContent)
    ? "Já existe um índice com essa combinação; só o que mudou em docs/ será reindexado."
    : "A pasta docs/ será indexada inteira de novo" + (/não baixado/.test(opt.textContent) ? " (o modelo será baixado antes, pode levar vários minutos)" : "") + ".";
  if (!confirm(`Trocar ${what}?\n\n${warn}\nO índice atual é mantido, dá para voltar depois.`)) {
    loadIndex(); return;
  }
  const selects = [$("#opt-emb"), $("#opt-chunk")];
  selects.forEach(s => s.disabled = true); $("#send").disabled = true;
  try {
    const r = await fetch("/api/index", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    let failed = null;
    await readSSE(r, {
      status: msg => toast(msg),
      done: d => toast(`✓ ${d.embedding_model.split("/").pop()} + ${d.chunker}` + (d.stats ? ` · ${describe(d.stats)}` : "")),
      error: msg => { failed = msg; },
    });
    if (failed) throw new Error(failed);
  } catch (err) { toast(`Não consegui trocar: ${err.message}`, true); }
  selects.forEach(s => s.disabled = false); $("#send").disabled = busy;
  loadIndex(); loadDocs(); loadStatus();
}
$("#opt-emb").addEventListener("change", e => switchIndex({ embedding_model: e.target.value }, e.target));
$("#opt-chunk").addEventListener("change", e => { showChunkDesc(); switchIndex({ chunker: e.target.value }, e.target); });

// ── Conversas ─────────────────────────────────────────────────
let currentConv = null;
const WELCOME = `<div class="welcome" id="welcome">
  <h2>Pergunte aos seus documentos</h2>
  <p>As respostas usam só o que está na base, com citações <span class="cite">1</span> para cada trecho usado. Clique numa citação para ver o trecho original.</p>
</div>`;

function when(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

async function loadConversations() {
  const ul = $("#convs");
  try {
    const list = await api("/api/conversations");
    if (!list.length) { ul.innerHTML = `<li class="empty">Nenhuma conversa ainda. Faça uma pergunta para começar.</li>`; return; }
    ul.innerHTML = list.map(c => `<li data-id="${c.id}" class="${c.id === currentConv ? "active" : ""}">
        <span class="name" title="${esc(c.title)}">${esc(c.title)}<div class="meta">${when(c.updated_at)} · ${Math.ceil(c.messages / 2)} pergunta(s)</div></span>
        <button class="ren-conv" title="Renomear">✎</button>
        <button class="del-conv" title="Apagar conversa">✕</button>
      </li>`).join("");
  } catch (e) { ul.innerHTML = `<li class="empty">Erro: ${esc(e.message)}</li>`; }
}

function setConv(id) {
  currentConv = id;
  try { id ? localStorage.setItem("conv", id) : localStorage.removeItem("conv"); } catch {}
  document.querySelectorAll("#convs li[data-id]").forEach(li => li.classList.toggle("active", li.dataset.id === id));
}

function newConversation() {
  if (busy) return;
  setConv(null);
  $("#chat").innerHTML = WELCOME;
  $("#q").focus();
}

function errorHtml(message) {
  return `<span style="color:var(--danger)">Erro: ${esc(message)}</span>` +
    (/ollama|connect|11434/i.test(message) ? `<br><small>O Ollama está rodando? (<code>ollama serve</code>)</small>` : "");
}

async function openConversation(id) {
  if (busy) return;
  try {
    const conv = await api(`/api/conversations/${id}`);
    $("#chat").innerHTML = conv.messages.length ? "" : WELCOME;
    for (const m of conv.messages) {
      if (m.role === "user") { addMsg("user", esc(m.content)); continue; }
      const msg = addMsg("bot", m.meta.error ? errorHtml(m.content) : markdown(m.content));
      if (!m.meta.error) renderSources(msg, m.meta);
    }
    setConv(id);
  } catch (e) {
    toast(e.message, true);
    newConversation();
  }
}

$("#new-conv").onclick = newConversation;
$("#convs").addEventListener("click", async e => {
  const li = e.target.closest("li[data-id]"); if (!li) return;
  const id = li.dataset.id, title = li.querySelector(".name").title;
  if (e.target.closest(".del-conv")) {
    if (!confirm(`Apagar a conversa "${title}"?`)) return;
    try {
      await api(`/api/conversations/${id}`, { method: "DELETE" });
      if (id === currentConv) newConversation();
      loadConversations();
    } catch (err) { toast(err.message, true); }
  } else if (e.target.closest(".ren-conv")) {
    const name = prompt("Novo nome da conversa:", title);
    if (!name?.trim()) return;
    try {
      await api(`/api/conversations/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: name.trim() }) });
      loadConversations();
    } catch (err) { toast(err.message, true); }
  } else if (id !== currentConv) {
    openConversation(id);
  }
});

document.querySelectorAll(".nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav button, .view").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); $(`#view-${b.dataset.view}`).classList.add("active");
  try { localStorage.setItem("view", b.dataset.view); } catch {}
});

// ── Chat ──────────────────────────────────────────────────────
function markdown(src) {
  const blocks = [];
  let s = esc(src).replace(/```[\w-]*\n?([\s\S]*?)(```|$)/g, (_, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
       .replace(/\[(\d+)\]/g, `<span class="cite" data-n="$1">$1</span>`);
  const out = []; let list = null;
  for (const line of s.split("\n")) {
    const m = line.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)/);
    if (m) {
      const type = m[1] ? "ul" : "ol";
      if (list !== type) { if (list) out.push(`</${list}>`); out.push(`<${type}>`); list = type; }
      out.push(`<li>${m[3]}</li>`); continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><strong>${h[1]}</strong></p>` : line.trim() ? `<p>${line}</p>` : "");
  }
  if (list) out.push(`</${list}>`);
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

function addMsg(role, html) {
  $("#welcome")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${html}</div>`;
  $("#chat").appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

function renderSources(msg, data) {
  const { sources, hyde, queries, options } = data;
  const used = [options?.multi_query && `multi-query (${options.multi_query})`, options?.hyde && "HyDE", options?.rerank && "reranker"].filter(Boolean);
  const tags = [data.model, used.length && `busca com ${used.join(" + ")}`].filter(Boolean);
  if (tags.length) msg.insertAdjacentHTML("beforeend", `<div class="tags">${esc(tags.join(" · "))}</div>`);
  if (queries?.length) msg.insertAdjacentHTML("beforeend", `<details class="hyde"><summary>Variações da pergunta usadas na busca (multi-query)</summary><ol>${queries.map(q => `<li>${esc(q)}</li>`).join("")}</ol></details>`);
  if (hyde) msg.insertAdjacentHTML("beforeend", `<details class="hyde"><summary>Documento hipotético usado na busca (HyDE)</summary><div>${esc(hyde)}</div></details>`);
  if (!sources?.length) return;
  const box = document.createElement("div"); box.className = "sources";
  box.innerHTML = sources.sort((a, b) => b.cited - a.cited || a.n - b.n).map(s => `
    <details data-n="${s.n}" class="${s.cited ? "" : "uncited"}">
      <summary><span class="cite">${s.n}</span> ${esc(s.label)}${s.cited ? "" : " <small>(não citado)</small>"}${s.rerank_score != null ? `<span class="score" title="score do reranker">${s.rerank_score.toFixed(3)}</span>` : ""}</summary>
      <div class="excerpt">${esc(s.text || "")}</div>
    </details>`).join("");
  msg.appendChild(box);
}

$("#chat").addEventListener("click", e => {
  const c = e.target.closest(".bubble .cite"); if (!c) return;
  const d = c.closest(".msg").querySelector(`.sources details[data-n="${c.dataset.n}"]`); if (!d) return;
  d.open = true; d.scrollIntoView({ block: "nearest", behavior: "smooth" });
  d.classList.add("flash"); setTimeout(() => d.classList.remove("flash"), 1200);
});

async function ask(question) {
  busy = true; $("#send").disabled = true;
  addMsg("user", esc(question));
  const msg = addMsg("bot", `<span class="thinking">Buscando nos documentos…</span>`);
  const bubble = msg.querySelector(".bubble");
  let text = "";
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, conversation_id: currentConv, rerank: $("#opt-rerank").checked, hyde: $("#opt-hyde").checked, multi_query: mqValue(), model: $("#opt-model").value || null }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const follow = () => msg.scrollIntoView({ block: "end" });
    await readSSE(r, {
      conversation: c => { if (c.id !== currentConv) { setConv(c.id); loadConversations(); } },
      token: t => { text += t; bubble.innerHTML = markdown(text); bubble.classList.add("cursor"); follow(); },
      status: s => { if (!text) bubble.innerHTML = `<span class="thinking">${esc(s)}</span>`; },
      done: d => { bubble.classList.remove("cursor"); bubble.innerHTML = markdown(d.answer); renderSources(msg, d); follow(); },
      error: err => { throw new Error(err); },
    });
  } catch (e) {
    bubble.classList.remove("cursor");
    bubble.innerHTML = errorHtml(e.message);
  }
  loadConversations();
  busy = false; $("#send").disabled = false; $("#q").focus();
}

const q = $("#q");
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask").requestSubmit(); } });
$("#ask").onsubmit = e => {
  e.preventDefault();
  const question = q.value.trim(); if (!question || busy) return;
  q.value = ""; q.style.height = "auto"; ask(question);
};

let savedConv = null, savedView = null;
try { savedConv = localStorage.getItem("conv"); savedView = localStorage.getItem("view"); } catch {}
if (savedView === "base") document.querySelector('.nav button[data-view="base"]').click();
savedConv ? openConversation(savedConv) : newConversation();
loadStatus(); loadDocs(); loadModels(); loadIndex(); loadConversations();
</script>
</body>
</html>
